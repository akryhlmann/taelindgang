device:
  id: "Hovedindgang"
  location: "main_entrance"

camera:
  # TP-Link Tapo / Vigi — Camera Account sættes i Tapo-appen:
  # Indstillinger → Avanceret → Camera Account
  # /stream1 = HD, /stream2 = SD (lavere CPU-belastning)
  rtsp_url: "rtsp://192.168.10.13/stream1"
  username: "borneland"
  password: "zikkestardust"
  fps_target: 10
  reconnect_interval: 5

ai:
  model_path: "/usr/share/hailo-models/yolov8s_h8l.hef"
  confidence_threshold: 0.5
  input_width: 640
  input_height: 640

counting:
  line:
    point1: [0.2, 0.5]
    point2: [0.8, 0.5]
    in_direction: "top"
  tracker:
    max_disappeared: 10
    max_distance: 100

storage:
  csv_path: "~/data/counts.csv"
  db_path: "~/data/visitor_counts.db"

event:
  name: "Mit Event"
  # Åbningstider pr. dag — kun i disse tidsrum sendes LoRa-pakker
  # Dage der ikke er angivet anses som lukkede
  schedule:
    wednesday: {open: "10:00", close: "22:00"}
    thursday:  {open: "10:00", close: "23:00"}
    friday:    {open: "10:00", close: "23:00"}
    saturday:  {open: "10:00", close: "23:00"}
    sunday:    {open: "10:00", close: "18:00"}

lora:
  # SX1276 868 MHz module — NSS=GPIO8 (CE0, hardware), RST=GPIO17
  spi_bus: 0
  spi_device: 0
  reset_pin: 17
  frequency: 868000000
  tx_power: 17
  spreading_factor: 7
  bandwidth: 125000
  send_interval: 300

setup_mode:
  enabled: true
  port: 8080               # Port for setup web interface (http://<rpi-ip>:8080)

debug:
  mock_camera: false
  person_interval: 15.0

logging:
  level: "INFO"
  log_file: "~/logs/device1.log"
