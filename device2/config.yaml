device:
  id: "RECEIVER_01"

event:
  name: "Mit Event"
  schedule:
    wednesday: {open: "10:00", close: "22:00"}
    thursday:  {open: "10:00", close: "23:00"}
    friday:    {open: "10:00", close: "23:00"}
    saturday:  {open: "10:00", close: "23:00"}
    sunday:    {open: "10:00", close: "18:00"}

lora:
  # SX1276 868 MHz module — NSS=GPIO8 (CE0, hardware), RST=GPIO17
  spi_bus: 0
  spi_device: 0
  reset_pin: 17
  frequency: 868000000
  spreading_factor: 7
  bandwidth: 125000

storage:
  db_path: "~/data/visitor_counts.db"
  csv_path: "~/data/received_counts.csv"

google_sheets:
  credentials_file: "~/config/service_account.json"
  spreadsheet_id: "1YOipFBhkIKjSxegqOIpOaN9grYlBB90s_eQxi90gcT8"
  worksheet_name: "Visitor Counts"
  sync_interval: 60

dashboard:
  host: "0.0.0.0"
  port: 8050
  refresh_interval: 30

debug:
  mock_lora: false  # Sæt til true for at simulere LoRa-modtagelse (ingen hardware nødvendig)

logging:
  level: "INFO"
  log_file: "~/logs/device2.log"
