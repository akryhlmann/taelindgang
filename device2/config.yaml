device:
  id: "RECEIVER_01"

lora:
  spi_bus: 0
  spi_device: 0
  reset_pin: 22
  dio0_pin: 18
  frequency: 868000000
  spreading_factor: 7
  bandwidth: 125000

storage:
  db_path: "/home/pi/data/visitor_counts.db"
  csv_path: "/home/pi/data/received_counts.csv"

google_sheets:
  credentials_file: "/home/pi/config/service_account.json"
  spreadsheet_id: "YOUR_SPREADSHEET_ID"
  worksheet_name: "Visitor Counts"
  sync_interval: 60

dashboard:
  host: "0.0.0.0"
  port: 8050
  refresh_interval: 30

logging:
  level: "INFO"
  log_file: "/home/pi/logs/device2.log"
