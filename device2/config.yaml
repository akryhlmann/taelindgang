device:
  id: "RECEIVER_01"

lora:
  # Waveshare SX1262 LoRaWAN Node Module — BCM pin numbers
  spi_bus: 0
  spi_device: 0
  cs_pin: 21
  reset_pin: 18
  busy_pin: 20
  dio1_pin: 16
  txen_pin: 6
  frequency: 868000000
  spreading_factor: 7
  bandwidth: 125000

storage:
  db_path: "~/data/visitor_counts.db"
  csv_path: "~/data/received_counts.csv"

google_sheets:
  credentials_file: "~/config/service_account.json"
  spreadsheet_id: "1YOipFBhkIKjSxegqOIpOaN9grYlBB90s_eQxi90gcT8"
  worksheet_name: "Visitor Counts"
  sync_interval: 60

dashboard:
  host: "0.0.0.0"
  port: 8050
  refresh_interval: 30

logging:
  level: "INFO"
  log_file: "~/logs/device2.log"
